name: Validate packs
on: [push, pull_request]
jobs:
  core-and-packs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - run: dotnet test tests/SephiriaSkins.Tests -c Release
      - run: dotnet run --project tools/PackTool -c Release -- validate-all catalog/catalog-1.0.33.json packs
      - run: dotnet run --project tools/PackTool -c Release -- validate-all catalog/catalog-1.0.33.json examples
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tools/tests -v
      - name: Verify pinned BepInEx runtime staging
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/runtime-ci/licenses -Force | Out-Null
          Copy-Item -Path licenses/* -Destination dist/runtime-ci/licenses
          ./tools/StageBepInEx.ps1 -Stage "$PWD/dist/runtime-ci"
